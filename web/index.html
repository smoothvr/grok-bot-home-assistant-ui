<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en" manifest="eye-ui.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grok Bot">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<title>Grok Bot Home Assistant UI</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #f4efe8; }
  body {
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
  }
  canvas { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: block; }
  #dim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #000; opacity: 0; pointer-events: none; z-index: 2; }
  #uhr {
    position: fixed; z-index: 4; top: 18px; left: 50%;
    transform: translateX(-50%);
    margin: 0; padding: 0; border: 0; background: transparent; color: rgba(244, 239, 232, .72);
    font: 500 28px/1 -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums; letter-spacing: .04em; pointer-events: none;
  }
  #caption {
    position: fixed; z-index: 4; left: 0; right: 0; bottom: 52px;
    margin: 0; text-align: center; pointer-events: none;
    color: rgba(244, 239, 232, .55); font-size: 18px; letter-spacing: .02em;
  }
  #caption.is-alarm { color: #ff3a30; }
  #caption.is-sleep { letter-spacing: .18em; }
  #hinweis {
    position: fixed; z-index: 5; left: 50%; bottom: 14%;
    transform: translateX(-50%);
    width: 70%; max-width: 22rem;
    margin: 0; padding: 16px 22px 18px; border: 0; border-radius: 22px;
    background: rgba(24, 18, 14, .92); color: #f4efe8;
    box-shadow: 0 0 40px rgba(255, 176, 102, .18);
    text-align: center; cursor: pointer;
  }
  #hinweis-label {
    display: block; font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(244, 239, 232, .62); font-weight: 600;
  }
  #hinweis-text { display: block; margin-top: 8px; font-size: 28px; font-weight: 500; line-height: 1.2; }
  #hear-hint {
    position: fixed; z-index: 4; left: 0; right: 0; bottom: 16px;
    margin: 0; text-align: center; pointer-events: none;
    color: rgba(244, 239, 232, .38); font-size: 13px;
  }
  #schein {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    pointer-events: none; z-index: 1; opacity: 0;
    box-shadow: inset 0 0 90px 12px rgba(255, 106, 0, .8);
  }
  #ecke {
    position: fixed; z-index: 6; top: 0; left: 0; width: 88px; height: 88px;
    margin: 0; padding: 0; border: 0; background: transparent; color: transparent;
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated eyes"></canvas>
<div id="schein" aria-hidden="true"></div>
<div id="dim" aria-hidden="true"></div>
<p id="uhr" hidden></p>
<p id="caption" hidden></p>
<button type="button" id="hinweis" hidden>
  <span id="hinweis-label">Don't forget</span>
  <span id="hinweis-text"></span>
</button>
<p id="hear-hint">tap me to hear me</p>
<button type="button" id="ecke" aria-label="Settings"></button>
<script>
(function () {
  var modern = false;
  try {
    modern = typeof Object.fromEntries === 'function' &&
      typeof String.prototype.replaceAll === 'function' &&
      typeof window.PointerEvent === 'function' &&
      typeof window.AudioContext === 'function';
    eval('var probe = ({a:1, ...{b:2}}); probe?.a ?? 0;');
  } catch (err) {
    modern = false;
  }
  var script = document.createElement('script');
  if (modern) {
    script.type = 'module';
    script.src = 'app.js';
  } else {
    script.src = 'legacy.js';
  }
  document.head.appendChild(script);
})();
</script>
</body>
</html>
