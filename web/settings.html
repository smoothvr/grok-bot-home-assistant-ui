<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en" manifest="eye-ui.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<title>Settings</title>
<style>
  html, body { margin: 0; background: #000; color: #f4efe8; }
  body {
    font: 18px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    padding: 28px 22px 72px;
  }
  main { max-width: 32rem; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 500; margin: 0 0 28px; letter-spacing: 0; }
  h2 { font-size: 20px; font-weight: 500; margin: 0 0 12px; }
  button {
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
  }
  [hidden] { display: none; }
  .feld { margin: 0 0 28px; }
  .kopf { overflow: hidden; margin: 0 0 8px; }
  .kopf span, .zeile .name { font-size: 20px; }
  .wert { float: right; color: #ffd7a8; }
  .zeile { overflow: hidden; min-height: 64px; }
  .zeile .name { float: left; line-height: 44px; }
  .wahl-knopf, .preview-btn, .text-knopf, .demo-zeile, .verbind-knopf {
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    background: #1a1612;
    color: #d9d0c6;
  }
  .wahl-knopf {
    display: inline-block;
    min-height: 60px;
    min-width: 64px;
    margin: 0 8px 8px 0;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 18px;
  }
  .wahl-knopf.an { background: #3a2614; color: #ffd7a8; }
  .schieber-leiste { position: relative; height: 64px; }
  .schieber-spur {
    position: absolute; left: 0; right: 0; top: 28px; height: 8px;
    border-radius: 4px; background: #2a241c;
  }
  .schieber-fuellung {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    border-radius: 4px; background: #e8893a;
  }
  .schieber-knopf {
    position: absolute; top: 14px; width: 36px; height: 36px; margin-left: -18px;
    border-radius: 18px; background: #f4efe8;
  }
  .schalter {
    float: right;
    width: 76px; height: 44px; margin-top: 10px; padding: 0;
    border: 0; border-radius: 22px; background: #2a241c; position: relative;
  }
  .schalter.an { background: #c46a1a; }
  .schalter-knopf {
    position: absolute; top: 4px; left: 4px; width: 36px; height: 36px;
    border-radius: 18px; background: #f4efe8;
  }
  .schalter.an .schalter-knopf { left: 36px; }
  .demo-zeile, .verbind-knopf, .text-knopf {
    display: block; width: 100%; min-height: 52px; margin: 0;
    padding: 12px 0; text-align: left; font-size: 20px; background: transparent; color: #f4efe8;
  }
  .verbind-knopf, .text-knopf { color: #8a8176; font-size: 16px; min-height: 44px; }
  .kasten { margin: 0 0 20px; }
  .kasten label { display: block; margin: 0 0 8px; font-size: 15px; color: #b7aea3; }
  .kasten input {
    -webkit-appearance: none;
    appearance: none;
    display: block; width: 100%; box-sizing: border-box;
    margin: 0 0 16px; padding: 14px 12px;
    border: 1px solid #2a241c; border-radius: 12px;
    background: #141210; color: #f4efe8; font: 17px/1.3 -apple-system, Helvetica, Arial, sans-serif;
  }
  .aktionen { margin-top: 8px; }
  .speichern, .schliessen {
    display: block; width: 100%; min-height: 56px; margin: 0 0 12px;
    border: 0; border-radius: 16px; font-size: 18px;
  }
  .speichern { background: #e8893a; color: #1a1008; }
  .schliessen { background: transparent; color: #b7aea3; }
  #form-fehler { min-height: 1.2em; margin: 0 0 8px; color: #e7a394; font-size: 15px; }
  #preview-reactions { margin-top: 8px; color: #8a8176; }
  #preview-reactions summary {
    font-size: 18px; padding: 16px 0; min-height: 44px;
  }
  #preview-reactions summary::-webkit-details-marker { display: none; }
  #preview-reactions p { margin: 0 0 8px; font-size: 15px; }
  .preview-btn {
    display: inline-block; min-height: 44px; margin: 0 8px 8px 0; padding: 10px 14px;
    border-radius: 999px; font-size: 15px;
  }
  footer { margin-top: 28px; }
  footer a { color: #8a8176; text-decoration: none; margin-right: 12px; }
  footer img { vertical-align: middle; }
  #credits { margin-top: 12px; font-size: 14px; color: #8a8176; }
  #credits a { color: #b7aea3; }
</style>
</head>
<body>
<main>
  <h1 data-i18n="settings.title" data-help="phone">Settings</h1>
  <form id="form">
    <section class="feld" id="feld-schlaf">
      <div class="kopf"><span data-i18n="settings.sleep">Sleep</span></div>
      <div class="wahl" id="schlaf-min"></div>
    </section>
    <section class="feld" id="feld-dim">
      <h2 data-i18n="settings.dim">Dim</h2>
      <div id="feld-dim-nach">
        <div class="kopf"><span data-i18n="settings.dimAfter">After</span></div>
        <div class="wahl" id="dim-nach"></div>
      </div>
      <div id="feld-dim-stufe">
        <div class="kopf"><span data-i18n="settings.dimLevel">Level</span></div>
        <div class="wahl" id="dim-stufe"></div>
      </div>
    </section>
    <section class="feld" id="feld-sprache">
      <div class="kopf"><span data-i18n="display.language">Language</span></div>
      <div class="wahl" id="sprache"></div>
    </section>
    <section class="feld" id="feld-laut">
      <div class="kopf">
        <span class="wert" id="laut-wert">160 %</span>
        <span data-i18n="display.volume">Volume</span>
      </div>
      <div class="schieber" id="lautstaerke">
        <div class="schieber-leiste">
          <div class="schieber-spur"><div class="schieber-fuellung"></div></div>
          <div class="schieber-knopf"></div>
        </div>
      </div>
    </section>
    <section class="feld" id="feld-leben">
      <div class="kopf"><span data-i18n="display.liveliness">Liveliness</span></div>
      <div class="wahl" id="lebendigkeit"></div>
    </section>
    <section class="feld zeile" id="feld-uhr">
      <span class="name" data-i18n="display.clock">Clock</span>
      <button type="button" class="schalter" id="uhr-an" aria-pressed="false"><span class="schalter-knopf"></span></button>
    </section>
    <section class="feld" id="feld-demo">
      <button type="button" class="demo-zeile" id="demo-start" data-i18n="demo.link">Demo</button>
    </section>
    <p id="form-fehler"></p>
    <div class="aktionen">
      <button type="submit" class="speichern" data-i18n="action.save">Save</button>
      <button type="button" class="schliessen" id="schliessen" data-i18n="action.close">Close</button>
    </div>
  </form>
  <p id="feld-verbindung" hidden>
    <button type="button" class="verbind-knopf" id="verbindung" data-i18n="settings.link">Connection</button>
  </p>
  <div class="kasten" id="verbindung-kasten" hidden>
    <div id="feld-url">
      <label for="ha-url" data-i18n="ha.url">Address</label>
      <input id="ha-url" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ws://homeassistant.local:8123/api/websocket">
    </div>
    <div id="feld-token">
      <label for="ha-token" data-i18n="ha.token">Long-lived token</label>
      <input id="ha-token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" class="text-knopf" id="token-loeschen" data-i18n="ha.forget">Delete the saved token</button>
    </div>
  </div>
  <details id="preview-reactions">
    <summary data-i18n="preview.summary">Reactions</summary>
    <p data-i18n="preview.help">A quiet list for trying each reaction. The first tap on the face unlocks the sound.</p>
    <div id="preview-list"></div>
    <p><button type="button" id="klingel-test" class="preview-btn" data-i18n="doorbell.test">Test the doorbell</button></p>
  </details>
  <footer class="fuss">
    <a id="version" href="https://www.herrvonundzu.eu/grok-bot-universal-home-assistant-ui/#changelog">v2.2.6</a>
    <a class="logo-only" href="https://www.herrvonundzu.eu/digitalisierung-automatisierung-4">
      <img src="assets/brand/hvuz-logo.jpg" width="22" height="22" alt="HVUZ">
    </a>
  </footer>
  <div id="credits">
    <p data-i18n="credits.short">Credits and notices are on the project page.</p>
    <p><a id="link-projekt" href="https://www.herrvonundzu.eu/grok-bot-universal-home-assistant-ui/#credits" data-i18n="credits.page">Project page</a></p>
  </div>
</main>
<script>
(function () {
  var modern = false;
  try {
    modern = typeof Object.fromEntries === 'function' &&
      typeof String.prototype.replaceAll === 'function' &&
      typeof window.PointerEvent === 'function' &&
      typeof window.AudioContext === 'function';
    eval('var probe = ({a:1, ...{b:2}}); probe?.a ?? 0;');
  } catch (err) {
    modern = false;
  }
  var script = document.createElement('script');
  if (modern) {
    script.type = 'module';
    script.src = 'settings.js';
  } else {
    script.src = 'settings-legacy.js';
  }
  document.head.appendChild(script);
})();
</script>
</body>
</html>
